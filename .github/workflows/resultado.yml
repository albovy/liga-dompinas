# Guarda el resultado de un partido de la Liga Dompiñas (los tantos de cada set) y vuelve a publicar la web.
# Este archivo va en el repositorio como: .github/workflows/resultado.yml
#
# Lo lanza la página («Poner resultado», con la llave de entrenador, la misma que la del calendario del club: un
# token de GitHub de grano fino con el permiso «Actions: lectura y escritura» en el repositorio del calendario y en
# este). Guarda el resultado junto a la liga (config.json › liga › archivo; en liga/resultados-<liga>.json, que
# src/liga.js valida, con los equipos que jugaron: los que enseñaba la página) y publica la web (publicar.yml, que
# vuelve a calcular la clasificación) en la misma ejecución: si la publicación falla, falla esta y GitHub avisa al
# dueño (a nombre de quien la lanza la llave).
#
# Los cambios de un mismo partido van en fila (vale el último), y si dos se guardan a la vez, el segundo se rehace
# encima. Guardar y publicar van en trabajos distintos: si falla la publicación, «Re-run failed jobs» solo vuelve a
# publicar, sin volver a guardar este resultado encima de uno más nuevo del mismo partido.

name: Resultado de la liga

on:
  workflow_dispatch:
    inputs:
      partido:
        description: 'Partido de la liga: P1, P2... (lo pone la página)'
        required: true
        type: string
      sets:
        description: 'Tantos de cada set, el local primero: 25-18 20-22 15-12 (para quitar el resultado: borrar)'
        required: true
        type: string
      local:
        description: 'El equipo local que enseñaba la página (su id; lo pone la página)'
        required: false
        default: ''
        type: string
      visitante:
        description: 'El equipo visitante que enseñaba la página (su id; lo pone la página)'
        required: false
        default: ''
        type: string
      antes:
        description: 'Al borrar, la huella del resultado que enseñaba la página: solo se borra si sigue siendo ese (lo pone la página)'
        required: false
        default: ''
        type: string

# Cada trabajo, lo suyo (ver abajo).
permissions: {}

# Los resultados de un mismo partido, en fila y sin cancelar el que está en marcha: vale el último. El nombre del
# grupo no se ejecuta.
concurrency:
  group: liga-${{ inputs.partido }}
  cancel-in-progress: false

jobs:
  guardar:
    permissions:
      contents: write             # guardar el resultado
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Las entradas van en variables de entorno, nunca dentro del script: así no se puede colar nada. Cada
      # intento empieza desde lo último guardado; si otro resultado se guardó a la vez, se rehace encima.
      - name: Guardar el resultado
        env:
          PARTIDO: ${{ inputs.partido }}
          SETS: ${{ inputs.sets }}
          LOCAL: ${{ inputs.local }}
          VISITANTE: ${{ inputs.visitante }}
          ANTES: ${{ inputs.antes }}
          RAMA: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for vez in 1 2 3 4 5; do
            git fetch -q origin "$RAMA"
            git reset -q --hard "origin/$RAMA"
            node src/liga.js
            git add -A -- liga
            if git diff --cached --quiet; then
              echo "El resultado ya estaba así."
              exit 0
            fi
            git commit -q -m 'Resultado de la liga puesto desde la web'
            if git push -q origin "HEAD:$RAMA"; then
              exit 0
            fi
            echo "Otro resultado se ha guardado a la vez; se vuelve a intentar."
            sleep $((vez * 3))
          done
          echo "::error::No se ha podido guardar el resultado; prueba otra vez desde la web."
          exit 1

  # Lo guardado con el token de esta ejecución no lanzaría publicar.yml por su cuenta: se llama aquí (publica la rama
  # tal como queda, con el resultado ya guardado).
  publicar:
    needs: guardar
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
